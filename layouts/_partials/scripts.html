{{ if .Param "math" }}
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
<script>
    MathJax = {
        tex: {
            displayMath: [['$$', '$$']],
            inlineMath: [['$', '$']]
        },
        loader: {
            load: ['ui/safe']
        }
    };
</script>
{{ end }}
{{ if .Store.Get "hasMermaid" }}
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
        startOnLoad: true,
        theme: 'base',
        themeVariables: {
            darkMode: true,
            background: '#282c34',
            noteBkgColor: '#282c34',
            noteTextColor: '#dcdfe4',
            primaryColor: '#282c34',
            primaryBorderColor: '#dcdfe4',
            primaryTextColor: '#dcdfe4',
            secondaryColor: '#61afef',
            secondaryTextColor: '#282c34',
            tertiaryColor: '#3d4148',
            tertiaryTextColor: '#dcdfe4',
            lineColor: '#dcdfe4',
            edgeLabelBackground: '#3d4148',
            fontFamily: '\'Source Serif 4,serif\''
        }
    });
</script>
{{ end }}
