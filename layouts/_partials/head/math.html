{{ if (or (.Param "math") (.Store.Get "hasMath"))}}
<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
<script>
    MathJax = {
        tex: {
            displayMath: [['$$', '$$']],
            inlineMath: [['$', '$']]
        },
        loader: {
            load: ['ui/safe']
        }
    };
</script>
{{ end }}
