{{- if .IsBlock }}
<figure>
{{- end }}
{{ $path := .Destination }}
{{ with .Page.Resources.Get $path }}
<img src="{{ .RelPermalink }}"
{{ else }}
{{ with resources.Get $path }}
<img src="{{ .RelPermalink }}"
{{ else }}
<img src="{{ .Destination | safeURL }}"
{{ end }}
{{ end }}
  {{- with .PlainText }} alt="{{ . }}"{{ end -}}
  {{- with .Title }} title="{{ . }}"{{ end -}}
>
{{- if .Title }}
<figcaption>{{ .Title }}</figcaption>
{{- end -}}
{{- if .IsBlock }}
</figure>
{{- end -}}
