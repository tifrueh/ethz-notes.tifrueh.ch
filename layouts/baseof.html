<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
    <head>
        {{ partial "head.html" . }}
    </head>
    <body>
        <div id="top-grid">
            <div class="top-block" id="header">
                {{ partial "header.html" . }}
            </div>
            <div class="top-block" id="menu">
                {{ partial "menu.html" . }}
            </div>
            <div class="top-block{{ if .Param "outline" }} narrow-main{{ end }}" id="main">
                <div id="content">
                    <div id="breadcrumb">
                        {{ partial "breadcrumb.html" . }}
                    </div>
                    <main>
                        {{ block "main" . }}
                        {{ end }}
                    </main>
                    <footer>
                        {{ partial "footer.html" . }}
                    </footer>
                </div>
            </div>
            {{ if .Param "outline" }}
            <div class="top-block" id="outline">
                {{ partial "outline.html" . }}
            </div>
            {{ end }}
        </div>
        {{ partial "svg.html" . }}
    </body>
</html>
