markup:
  highlight:
    noClasses: false
    linenos: true
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
    attribute:
      block: true
    extensions:
      passthrough:
        delimiters:
          block:
            - - '$$'
              - '$$'
          inline:
            - - '$'
              - '$'
        enable: true

module:
  hugoVersion:
    extended: false
    min: '0.158.0'
